<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión - ITLAC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <link rel="stylesheet" href="css/css_password.css">
    <style>
        .login-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        .divider {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 20px 0 5px 0;
        }
        .footer-link {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #6b7280;
        }
        .footer-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
        .alert-bloqueado {
            display: none;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 12px 16px;
            color: #991b1b;
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
        }
        .campo-error {
            border-color: #ef4444 !important;
            background: #fff5f5 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <img src="img/itlac.png" class="logo-bg" alt="ITLAC">

        <a href="../index.html" class="btn-back" style="display: inline-flex; align-items: center; padding: 6px 12px; background: #eff6ff; color: #2563eb; border-radius: 6px; font-weight: bold; text-decoration: none; margin-bottom: 12px; border: 1px solid #bfdbfe; font-size: 14px;">&larr; Volver al Menú</a>
        <div class="login-icon">🔐</div>
        <div class="header-acciones">
            <h1>Inicio de Sesión</h1>
        </div>

        <p class="subtitle">Accede con tu número de control y contraseña</p>

        <form id="formLogin" autocomplete="off" novalidate>

            <label for="nocontrol">No. Control</label>
            <input type="text" id="nocontrol" name="nocontrol" required
                   pattern="^[A-Za-z]?[0-9]{2,10}$"
                   maxlength="15"
                   placeholder="Ej: A001 o u200000"
                   autocomplete="username">

            <label for="password">Contraseña</label>
            <div class="password-container">
                <input type="password" id="password" name="password" required
                       minlength="8" maxlength="72"
                       placeholder="Tu contraseña"
                       autocomplete="current-password">
                <button type="button" class="toggle-password" id="togglePassword"
                        aria-label="Mostrar/ocultar contraseña">🔒</button>
            </div>

            <div class="alert-bloqueado" id="alertBloqueado">
                ⚠️ Demasiados intentos fallidos. Espera antes de intentar de nuevo.
            </div>

            <button type="submit" id="btnLogin">Iniciar Sesión</button>

        </form>

        <hr class="divider">

        <div class="footer-link">
            ¿No tienes cuenta?
            <a href="registro_con_password.html">Regístrate aquí</a>
        </div>

        <div id="respuesta" role="alert" aria-live="polite"></div>

    </div>
</div>

<script src="js/js_login.js"></script>
</body>
</html>
