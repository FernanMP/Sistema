<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro con Contraseña - ITLAC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <link rel="stylesheet" href="css/css_password.css">
</head>
<body>

<div class="container">
    <div class="card">

        <img src="img/itlac.png" class="logo-bg" alt="ITLAC">

        <a href="../index.html" class="btn-back" style="display: inline-flex; align-items: center; padding: 6px 12px; background: #eff6ff; color: #2563eb; border-radius: 6px; font-weight: bold; text-decoration: none; margin-bottom: 12px; border: 1px solid #bfdbfe; font-size: 14px;">&larr; Volver al Menú</a>
        <div class="header-acciones">
            <h1>Registro con Contraseña</h1>
        </div>

        <p class="subtitle">La contraseña se guardará cifrada con BCRYPT (costo 12)</p>

        <form id="formAlumnoPassword" method="post" autocomplete="off">

            <!-- FIX CSRF: token oculto, se llena por JS al cargar la página -->
            <input type="hidden" name="csrf_token" id="csrf_token" value="">

            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required
                   minlength="2" maxlength="100"
                   placeholder="Ej: Juan Pérez García">

            <label for="nocontrol">No. Control</label>
            <input type="text" id="nocontrol" name="nocontrol" required
                   pattern="^[A-Za-z]?[0-9]{2,10}$"
                   maxlength="15"
                   title="Formato: letra opcional + 2-10 dígitos (ej: A001, u200000)"
                   placeholder="Ej: A001 o u200000">

            <div class="row">
                <div>
                    <label for="grupo">Grupo</label>
                    <input type="text" id="grupo" name="grupo" required
                           minlength="1" maxlength="10"
                           placeholder="Ej: G1">
                </div>
                <div>
                    <label for="periodo">Periodo</label>
                    <input type="text" id="periodo" name="periodo" required
                           minlength="1" maxlength="10"
                           placeholder="Ej: 2026-1">
                </div>
            </div>

            <label for="email">Correo electrónico</label>
            <!-- FIX: autocomplete="off" en email para no exponer correos en sugerencias -->
            <input type="email" id="email" name="email" required
                   maxlength="100"
                   autocomplete="off"
                   placeholder="Ej: alumno@lcardenas.tecnm.mx">

            <label for="password">Contraseña</label>
            <div class="password-container">
                <input type="password" id="password" name="password" required
                       minlength="8" maxlength="72"
                       autocomplete="new-password">
                <button type="button" class="toggle-password" id="togglePassword"
                        aria-label="Mostrar/ocultar contraseña">🔒</button>
            </div>

            <div class="row">
                <div>
                    <label for="confirmar">Confirmar Contraseña</label>
                    <input type="password" id="confirmar" required
                           minlength="8" maxlength="72"
                           autocomplete="new-password">
                </div>
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar"></div>
                </div>
            </div>

            <button type="submit">Registrar Alumno con Bcrypt</button>
        </form>

        <div id="respuesta" role="alert" aria-live="polite"></div>

    </div>
</div>

<script src="js/js_password.js"></script>
</body>
</html>
